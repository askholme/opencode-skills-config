<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Float — TITLE HERE</title>

  <!-- Fonts: Fraunces (display), Inter (body), JetBrains Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,300&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Float deck kit (brand tokens + all components) -->
  <link rel="stylesheet" href="deck.css" />

  <!-- Lenis smooth scroll CSS -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css" />
</head>
<body class="grain">

  <div id="bg"></div>
  <nav id="slide-nav" aria-label="Slide-navigation"></nav>

  <!-- data-lenis opts in to desktop smooth scroll; native snap on mobile -->
  <div id="deck" data-lenis>

    <!-- ===== SLIDE 1 — TITLE ===== -->
    <section class="slide slide--title" data-label="Forside">
      <div class="inner slide-logo-inner">
        <div class="slide-logo-lockup">
          <svg width="44" height="44" viewBox="0 0 100 100" aria-label="Float" role="img">
            <defs>
              <clipPath id="float-circle"><circle cx="50" cy="50" r="46"></circle></clipPath>
              <linearGradient id="float-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#B8F2D6"></stop>
                <stop offset="100%" stop-color="#7AA8E0"></stop>
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <g clip-path="url(#float-circle)">
              <path class="float-wave--back" d="M -100 60 Q -75 50 -50 60 T 0 60 T 50 60 T 100 60 T 150 60 T 200 60 L 200 110 L -100 110 Z" fill="url(#float-grad)"></path>
              <path class="float-wave--front" d="M -100 68 Q -75 60 -50 68 T 0 68 T 50 68 T 100 68 T 150 68 T 200 68 L 200 110 L -100 110 Z" fill="#B8F2D6" opacity="0.35"></path>
            </g>
          </svg>
          <span style="font-family:var(--font-display);font-weight:300;font-size:1.25rem;letter-spacing:-0.02em;color:var(--mint);">Float</span>
        </div>

        <span class="eyebrow reveal">FLOAT · AI-NATIVE STRATEGI &amp; IMPLEMENTERING</span>
        <h1 class="reveal reveal--slow">Headline med <em class="accent">accent</em></h1>
        <p class="lede reveal">Subtitle in Fraunces light.</p>
        <p class="caption reveal">Måned ÅÅÅÅ</p>
      </div>
    </section>

    <!-- ===== SLIDE 2 — CONTENT (duplicate & edit; see references/components.md) ===== -->
    <section class="slide" data-label="Sektion">
      <div class="inner">
        <span class="eyebrow reveal">EYEBROW</span>
        <h2 class="reveal">Overskrift med <em class="accent">accent</em></h2>
        <p class="lede reveal">Framing sentence.</p>
        <!-- add components from references/components.md -->
      </div>
    </section>

  </div><!-- /#deck -->

  <!-- Zoom controls (visible only in fullscreen) -->
  <div id="zoom-controls" aria-label="Zoom-kontrol">
    <button id="zoom-out" aria-label="Zoom ud" title="Zoom ud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12"></line></svg></button>
    <span id="zoom-level">100%</span>
    <button id="zoom-in" aria-label="Zoom ind" title="Zoom ind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"></line><line x1="6" y1="12" x2="18" y2="12"></line></svg></button>
  </div>

  <!-- Fullscreen toggle -->
  <button id="fs-btn" aria-label="Skift fuldskærm" title="Skift fuldskærm">
    <svg id="fs-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
    <svg id="fs-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="10" y1="14" x2="3" y2="21"></line><line x1="21" y1="3" x2="14" y2="10"></line></svg>
  </button>

  <!-- Lenis (must load before deck.js) -->
  <script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
  <script src="https://unpkg.com/lenis@1.3.23/dist/lenis-snap.min.js"></script>
  <!-- Float deck engine -->
  <script src="deck.js"></script>
</body>
</html>
